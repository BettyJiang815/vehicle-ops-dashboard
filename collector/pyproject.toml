[project]
name = "vehicle-ops-collector"
version = "1.2.0"
description = "车队状态采集与同步（零第三方依赖）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
